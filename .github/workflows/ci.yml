name: Website CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Website test and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run regression suite
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  container:
    name: Hardened production container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build production image
        run: docker build --build-arg VCS_REF=${{ github.sha }} --tag lians-website:test .
      - name: Verify non-root runtime and excluded files
        run: |
          test "$(docker image inspect lians-website:test --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm lians-website:test test ! -e /app/.env
          docker run --rm lians-website:test test ! -e /app/.git
          docker run --rm lians-website:test test ! -e /app/test
